<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Pulse - Deep Work & Pomodoro Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        work: '#f43f5e',
                        rest: '#10b981'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for statistics visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Smooth timer progress circle transitions */
        .timer-circle {
            transition: stroke-dashoffset 0.5s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans min-h-screen transition-colors duration-300 flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Header / Navigation -->
    <header class="w-full max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-emerald-500 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid font-bold fa-stopwatch text-lg"></i>
            </div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-gray-900 to-gray-600 dark:from-white dark:to-gray-400 bg-clip-text text-transparent">FocusPulse</span>
        </div>
        
        <div class="flex items-center space-x-2">
            <button id="quickStartBtn" title="Instant 25 min Session" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 transition flex items-center gap-1.5">
                <i class="fa-solid fa-bolt"></i>
                <span class="hidden sm:inline">Quick 25m</span>
            </button>
            <button id="themeToggle" class="p-2.5 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded-xl hover:bg-gray-200/50 dark:hover:bg-gray-800 transition">
                <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                <i class="fa-solid fa-sun text-lg hidden dark:block"></i>
            </button>
            <button id="settingsBtn" class="p-2.5 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded-xl hover:bg-gray-200/50 dark:hover:bg-gray-800 transition">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-1 flex flex-col items-center justify-center gap-8">
        
        <!-- Mode Switcher Tabs -->
        <div class="flex p-1.5 bg-gray-200/70 dark:bg-gray-900/80 rounded-2xl border border-gray-300/40 dark:border-gray-800 backdrop-blur-md">
            <button id="modeWork" class="px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 shadow-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
                <i class="fa-solid fa-brain mr-1.5 text-rose-500"></i>Deep Work (25m)
            </button>
            <button id="modeBreak" class="px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                <i class="fa-solid fa-mug-hot mr-1.5 text-emerald-500"></i>Rest Break (5m)
            </button>
        </div>

        <!-- Timer Circle Container -->
        <div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center">
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <!-- Background track -->
                <circle cx="50" cy="50" r="44" stroke-width="4" class="stroke-gray-200 dark:stroke-gray-800" fill="none" />
                <!-- Dynamic progress circle -->
                <circle id="timerProgress" cx="50" cy="50" r="44" stroke-width="5" 
                        class="timer-circle stroke-rose-500" 
                        stroke-linecap="round" 
                        fill="none" 
                        stroke-dasharray="276.46" 
                        stroke-dashoffset="0" />
            </svg>
            
            <!-- Timer Text Display -->
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="sessionTag" class="text-xs uppercase font-bold tracking-widest text-rose-500 dark:text-rose-400 mb-1">Deep Work</span>
                <span id="timerDisplay" class="text-6xl sm:text-7xl font-extrabold tracking-tight font-mono text-gray-900 dark:text-white">25:00</span>
                <span id="targetLabel" class="text-xs text-gray-400 dark:text-gray-500 mt-2">Ready to focus?</span>
            </div>
        </div>

        <!-- Timer Controls -->
        <div class="flex items-center gap-4">
            <button id="resetBtn" class="w-12 h-12 rounded-2xl bg-gray-200/70 dark:bg-gray-900 hover:bg-gray-300 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center transition active:scale-95 shadow-sm">
                <i class="fa-solid fa-rotate-right text-lg"></i>
            </button>
            <button id="startPauseBtn" class="px-8 h-14 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-lg flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg shadow-rose-500/25 w-44">
                <i id="startPauseIcon" class="fa-solid fa-play"></i>
                <span id="startPauseText">Start</span>
            </button>
            <button id="skipBtn" class="w-12 h-12 rounded-2xl bg-gray-200/70 dark:bg-gray-900 hover:bg-gray-300 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center transition active:scale-95 shadow-sm">
                <i class="fa-solid fa-forward-step text-lg"></i>
            </button>
        </div>

        <!-- Daily Metric Highlights Cards -->
        <div class="grid grid-cols-3 gap-3 w-full max-w-lg mt-4">
            <div class="bg-white dark:bg-gray-900 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-800 text-center shadow-sm">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider mb-1">Today</div>
                <div id="todayFocusTime" class="text-xl font-bold text-gray-900 dark:text-white">0 min</div>
            </div>
            <div class="bg-white dark:bg-gray-900 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-800 text-center shadow-sm">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider mb-1">Sessions</div>
                <div id="todaySessions" class="text-xl font-bold text-rose-500 dark:text-rose-400">0</div>
            </div>
            <div class="bg-white dark:bg-gray-900 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-800 text-center shadow-sm">
                <div class="text-gray-400 text-xs font-medium uppercase tracking-wider mb-1">Streak</div>
                <div id="streakDays" class="text-xl font-bold text-amber-500">0 days</div>
            </div>
        </div>

        <!-- Detailed Analytics & Logs Section -->
        <div class="w-full max-w-2xl bg-white dark:bg-gray-900 rounded-3xl p-5 border border-gray-100 dark:border-gray-800 shadow-sm mt-2">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-column text-rose-500"></i> Activity Overview
                </h3>
                <div class="flex gap-2">
                    <button id="toggleLogsBtn" class="text-xs font-medium text-gray-500 hover:text-gray-900 dark:hover:text-white px-2.5 py-1 rounded-lg bg-gray-100 dark:bg-gray-800 transition">
                        View History
                    </button>
                </div>
            </div>

            <!-- Weekly Chart -->
            <div id="chartContainer" class="h-44 w-full">
                <canvas id="weeklyChart"></canvas>
            </div>

            <!-- Session History Logs Table (Hidden by default or toggled) -->
            <div id="logsContainer" class="hidden mt-4 pt-4 border-t border-gray-100 dark:border-gray-800 max-h-56 overflow-y-auto">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold uppercase text-gray-400 tracking-wider">Completed Sessions Log</span>
                    <button id="clearLogsBtn" class="text-xs text-rose-500 hover:underline">Clear History</button>
                </div>
                <ul id="sessionLogsList" class="space-y-2">
                    <!-- Dynamic logs inserted here -->
                </ul>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-gray-400 dark:text-gray-600">
        FocusPulse • Measure to Improve • Works offline & saves locally
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 w-full max-w-md shadow-xl border border-gray-100 dark:border-gray-800 mx-4">
            <div class="flex items-center justify-between mb-5">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white">Timer & Data Settings</h3>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Durations (minutes)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="text-sm text-gray-700 dark:text-gray-300">Work Duration</span>
                            <input type="number" id="settingWorkTime" value="25" min="1" max="120" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-gray-900 dark:text-white border border-transparent focus:border-rose-500 outline-none">
                        </div>
                        <div>
                            <span class="text-sm text-gray-700 dark:text-gray-300">Break Duration</span>
                            <input type="number" id="settingBreakTime" value="5" min="1" max="60" class="w-full mt-1 px-3 py-2 bg-gray-100 dark:bg-gray-800 rounded-xl text-gray-900 dark:text-white border border-transparent focus:border-emerald-500 outline-none">
                        </div>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100 dark:border-gray-800">
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Sound & Alerts</label>
                    <div class="flex items-center justify-between py-1">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Sound Notification Cue</span>
                        <input type="checkbox" id="settingSoundToggle" checked class="accent-rose-500 w-4 h-4">
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100 dark:border-gray-800">
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Backup & Restore</label>
                    <div class="flex gap-2">
                        <button id="exportBtn" class="flex-1 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-semibold rounded-xl text-gray-700 dark:text-gray-300 transition">
                            <i class="fa-solid fa-download mr-1"></i> Export Data
                        </button>
                        <button id="importBtn" class="flex-1 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-xs font-semibold rounded-xl text-gray-700 dark:text-gray-300 transition">
                            <i class="fa-solid fa-upload mr-1"></i> Import Data
                        </button>
                        <input type="file" id="importFileInput" class="hidden" accept=".json">
                    </div>
                </div>
            </div>

            <button id="saveSettingsBtn" class="w-full mt-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl transition">
                Save Changes
            </button>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // State Management
        let settings = {
            workDuration: 25,
            breakDuration: 5,
            soundEnabled: true
        };

        let currentMode = 'work'; // 'work' or 'break'
        let timerInterval = null;
        let isRunning = false;
        let timeRemaining = 25 * 60; // in seconds
        let totalDuration = 25 * 60;

        // Data Store
        let sessionLogs = [];

        // DOM Elements
        const timerDisplay = document.getElementById('timerDisplay');
        const sessionTag = document.getElementById('sessionTag');
        const targetLabel = document.getElementById('targetLabel');
        const timerProgress = document.getElementById('timerProgress');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const startPauseText = document.getElementById('startPauseText');
        const resetBtn = document.getElementById('resetBtn');
        const skipBtn = document.getElementById('skipBtn');
        const quickStartBtn = document.getElementById('quickStartBtn');
        const modeWork = document.getElementById('modeWork');
        const modeBreak = document.getElementById('modeBreak');
        const themeToggle = document.getElementById('themeToggle');

        const todayFocusTimeEl = document.getElementById('todayFocusTime');
        const todaySessionsEl = document.getElementById('todaySessions');
        const streakDaysEl = document.getElementById('streakDays');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingWorkTime = document.getElementById('settingWorkTime');
        const settingBreakTime = document.getElementById('settingBreakTime');
        const settingSoundToggle = document.getElementById('settingSoundToggle');
        
        const toggleLogsBtn = document.getElementById('toggleLogsBtn');
        const logsContainer = document.getElementById('logsContainer');
        const sessionLogsList = document.getElementById('sessionLogsList');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFileInput = document.getElementById('importFileInput');

        let weeklyChartInstance = null;

        // Initialize App
        function init() {
            loadSavedData();
            applyTheme();
            updateTimerDisplay();
            updateStatsUI();
            initChart();
            setupEventListeners();
            requestNotificationPermission();
        }

        // Local Storage Handling
        function loadSavedData() {
            const savedSettings = localStorage.getItem('fp_settings');
            if (savedSettings) {
                settings = JSON.parse(savedSettings);
                settingWorkTime.value = settings.workDuration;
                settingBreakTime.value = settings.breakDuration;
                settingSoundToggle.checked = settings.soundEnabled;
            }

            const savedLogs = localStorage.getItem('fp_logs');
            if (savedLogs) {
                sessionLogs = JSON.parse(savedLogs);
            }

            resetTimerState();
        }

        function saveData() {
            localStorage.setItem('fp_settings', JSON.stringify(settings));
            localStorage.setItem('fp_logs', JSON.stringify(sessionLogs));
            updateStatsUI();
            updateChart();
        }

        // Web Audio Synthesizer sound cue (no external audio required)
        function playAlertSound() {
            if (!settings.soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                if (currentMode === 'work') {
                    // Success chord chime for work end
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.15); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.30); // G5
                } else {
                    // Break finish chime
                    osc.frequency.setValueAtTime(659.25, now);
                    osc.frequency.setValueAtTime(523.25, now + 0.2);
                }

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.6);
            } catch (e) {
                console.log('Audio playback error:', e);
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
        }

        function sendNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3208/3208726.png' });
            }
        }

        // Timer Core Logic
        function resetTimerState() {
            clearInterval(timerInterval);
            isRunning = false;
            startPauseIcon.className = 'fa-solid fa-play';
            startPauseText.textContent = 'Start';
            
            if (currentMode === 'work') {
                totalDuration = settings.workDuration * 60;
                sessionTag.textContent = 'Deep Work';
                sessionTag.className = 'text-xs uppercase font-bold tracking-widest text-rose-500 dark:text-rose-400 mb-1';
                timerProgress.className = 'timer-circle stroke-rose-500';
                startPauseBtn.className = startPauseBtn.className.replace(/bg-\w+-500|hover:bg-\w+-600|shadow-\w+-500\/25/g, '') + ' bg-rose-500 hover:bg-rose-600 shadow-rose-500/25';
                targetLabel.textContent = 'Ready to focus?';
            } else {
                totalDuration = settings.breakDuration * 60;
                sessionTag.textContent = 'Rest Break';
                sessionTag.className = 'text-xs uppercase font-bold tracking-widest text-emerald-500 dark:text-emerald-400 mb-1';
                timerProgress.className = 'timer-circle stroke-emerald-500';
                startPauseBtn.className = startPauseBtn.className.replace(/bg-\w+-500|hover:bg-\w+-600|shadow-\w+-500\/25/g, '') + ' bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/25';
                targetLabel.textContent = 'Take a breath and rest.';
            }
            
            timeRemaining = totalDuration;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timerDisplay.textContent = formatted;

            // Update Window Title
            document.title = `${formatted} - ${currentMode === 'work' ? 'Focus' : 'Rest'} | FocusPulse`;

            // Progress Circle Calculation (Stroke circumference ~276.46)
            const circumference = 2 * Math.PI * 44;
            const progress = timeRemaining / totalDuration;
            const offset = circumference - (progress * circumference);
            timerProgress.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startPauseIcon.className = 'fa-solid fa-pause';
            startPauseText.textContent = 'Pause';

            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateTimerDisplay();
                } else {
                    completeSession();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startPauseIcon.className = 'fa-solid fa-play';
            startPauseText.textContent = 'Resume';
        }

        function completeSession() {
            clearInterval(timerInterval);
            isRunning = false;
            playAlertSound();

            if (currentMode === 'work') {
                // Log completed work session
                const sessionRecord = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    duration: settings.workDuration
                };
                sessionLogs.push(sessionRecord);
                saveData();

                sendNotification("Deep Work Finished!", `Great job! You focused for ${settings.workDuration} mins. Time for a break!`);
                
                // Auto switch to break mode
                currentMode = 'break';
                updateTabUI();
                resetTimerState();
            } else {
                sendNotification("Break Over!", "Ready to dive back into deep work?");
                currentMode = 'work';
                updateTabUI();
                resetTimerState();
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            updateTabUI();
            resetTimerState();
        }

        function updateTabUI() {
            if (currentMode === 'work') {
                modeWork.className = 'px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 shadow-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white';
                modeBreak.className = 'px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white';
            } else {
                modeBreak.className = 'px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 shadow-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-white';
                modeWork.className = 'px-5 py-2 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white';
            }
        }

        // Stats & Analytics Calculation
        function updateStatsUI() {
            const todayStr = new Date().toDateString();
            
            // Filter today's sessions
            const todayLogs = sessionLogs.filter(log => new Date(log.date).toDateString() === todayStr);
            const todayMins = todayLogs.reduce((acc, curr) => acc + curr.duration, 0);
            
            todayFocusTimeEl.textContent = `${todayMins} min`;
            todaySessionsEl.textContent = todayLogs.length;

            // Calculate daily streak
            streakDaysEl.textContent = `${calculateStreak()} days`;

            // Populate session history logs list
            renderLogsList();
        }

        function calculateStreak() {
            if (sessionLogs.length === 0) return 0;

            const dates = [...new Set(sessionLogs.map(log => new Date(log.date).toDateString()))]
                .map(d => new Date(d))
                .sort((a, b) => b - a);

            let streak = 0;
            let checkDate = new Date();
            checkDate.setHours(0, 0, 0, 0);

            // Check if user did work today or yesterday to preserve streak
            const latestDate = dates[0];
            latestDate.setHours(0, 0, 0, 0);

            const diffTime = Math.abs(checkDate - latestDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays > 1) return 0; // Streak broken

            let curr = latestDate;
            for (let d of dates) {
                if (curr.getTime() === d.getTime()) {
                    streak++;
                    curr.setDate(curr.getDate() - 1);
                } else {
                    break;
                }
            }

            return streak;
        }

        function renderLogsList() {
            sessionLogsList.innerHTML = '';
            if (sessionLogs.length === 0) {
                sessionLogsList.innerHTML = '<li class="text-xs text-gray-400 italic py-2">No completed sessions logged yet.</li>';
                return;
            }

            const sorted = [...sessionLogs].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.slice(0, 15).forEach(log => {
                const dateObj = new Date(log.date);
                const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString([], { month: 'short', day: 'numeric' });

                const li = document.createElement('li');
                li.className = 'flex items-center justify-between text-xs py-1.5 px-3 bg-gray-50 dark:bg-gray-800/50 rounded-xl';
                li.innerHTML = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-500"></i>
                        <span class="font-medium text-gray-700 dark:text-gray-300">25 Min Focus Session</span>
                    </div>
                    <span class="text-gray-400">${dateStr}, ${timeStr}</span>
                `;
                sessionLogsList.appendChild(li);
            });
        }

        // Chart.js Visual Breakdown
        function initChart() {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            const data = getPastSevenDaysData();

            weeklyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: 'Focus Minutes',
                        data: data.minutes,
                        backgroundColor: '#f43f5e',
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9ca3af', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(156, 163, 175, 0.1)' },
                            ticks: { color: '#9ca3af', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!weeklyChartInstance) return;
            const data = getPastSevenDaysData();
            weeklyChartInstance.data.labels = data.labels;
            weeklyChartInstance.data.datasets[0].data = data.minutes;
            weeklyChartInstance.update();
        }

        function getPastSevenDaysData() {
            const labels = [];
            const minutes = [];
            
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dayStr = d.toDateString();
                
                labels.push(d.toLocaleDateString([], { weekday: 'short' }));
                
                const dayMins = sessionLogs
                    .filter(log => new Date(log.date).toDateString() === dayStr)
                    .reduce((acc, curr) => acc + curr.duration, 0);
                
                minutes.push(dayMins);
            }

            return { labels, minutes };
        }

        // Theme toggle
        function applyTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Events Wire-up
        function setupEventListeners() {
            startPauseBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', resetTimerState);
            skipBtn.addEventListener('click', completeSession);
            
            quickStartBtn.addEventListener('click', () => {
                currentMode = 'work';
                updateTabUI();
                resetTimerState();
                startTimer();
            });

            modeWork.addEventListener('click', () => switchMode('work'));
            modeBreak.addEventListener('click', () => switchMode('break'));

            themeToggle.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateChart();
            });

            // Settings modal behavior
            settingsBtn.addEventListener('click', () => {
                settingsModal.classList.remove('hidden');
                setTimeout(() => settingsModal.classList.remove('opacity-0'), 10);
            });

            const closeSettings = () => {
                settingsModal.classList.add('opacity-0');
                setTimeout(() => settingsModal.classList.add('hidden'), 200);
            };

            closeSettingsBtn.addEventListener('click', closeSettings);

            saveSettingsBtn.addEventListener('click', () => {
                settings.workDuration = parseInt(settingWorkTime.value) || 25;
                settings.breakDuration = parseInt(settingBreakTime.value) || 5;
                settings.soundEnabled = settingSoundToggle.checked;
                saveData();
                resetTimerState();
                closeSettings();
            });

            // Logs toggle
            toggleLogsBtn.addEventListener('click', () => {
                logsContainer.classList.toggle('hidden');
                toggleLogsBtn.textContent = logsContainer.classList.contains('hidden') ? 'View History' : 'Hide History';
            });

            clearLogsBtn.addEventListener('click', () => {
                if (confirm('Clear all historical log data?')) {
                    sessionLogs = [];
                    saveData();
                }
            });

            // Import / Export Data
            exportBtn.addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ settings, logs: sessionLogs }));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `focuspulse_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            importBtn.addEventListener('click', () => importFileInput.click());

            importFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.logs && Array.isArray(parsed.logs)) {
                            sessionLogs = parsed.logs;
                        }
                        if (parsed.settings) {
                            settings = parsed.settings;
                        }
                        saveData();
                        resetTimerState();
                        alert('Data imported successfully!');
                    } catch (err) {
                        alert('Invalid JSON file payload.');
                    }
                };
                reader.readAsText(file);
            });
        }

        // Initialize on Load
        window.onload = init;
    </script>
</body>
</html>
